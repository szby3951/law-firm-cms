# ============================================================================
# 律所客户智能管理系统 —— Nginx 配置（无域名 / IP + HTTP 临时版）
#
# 放置位置：/etc/nginx/sites-available/law-firm
#           ln -s /etc/nginx/sites-available/law-firm /etc/nginx/sites-enabled/
#           rm -f /etc/nginx/sites-enabled/default
#
# 与 nginx.conf 的区别：去掉 SSL 与 HSTS，只监听 80，server_name 用 _ 兜底。
# 用途：域名还没备案/解析时先把系统跑起来。**登录密码在 HTTP 下是明文传输**，
#      拿到域名后请换回 nginx.conf 里的 HTTPS 版本。
#
# 关键点（与 HTTPS 版一致，不要删）：
#   1. location / 必须 try_files ... /index.html，否则刷新 /admin/dashboard 会 404；
#   2. AI 的 location 必须 proxy_buffering off + gzip off + 长超时，否则 SSE 卡住；
#   3. 必须透传 X-Forwarded-For，否则审计日志里的操作 IP 全是 127.0.0.1；
#   4. client_max_body_size 要与后端 MAX_UPLOAD_SIZE 对齐（20MB → 给到 25m）。
# ============================================================================

upstream law_firm_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    # 前端构建产物目录（frontend/dist 的内容）
    root  /var/www/law-firm/dist;
    index index.html;

    client_max_body_size 25m;
    client_body_timeout  120s;

    # 前端编译产物：内容哈希命名，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 入口 HTML 不缓存，保证发版后用户立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- AI 流式接口（SSE）----------
    # 必须放在 /api/ 之前：正则 location 优先级高于普通前缀匹配。
    location ~ ^/api/(ai|business)/ {
        proxy_pass http://law_firm_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- 普通 API ----------
    location /api/ {
        proxy_pass http://law_firm_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
    }

    # ---------- 健康检查：只给内网/本机 ----------
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://law_firm_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 接口文档：生产一律 404 ----------
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }
    location = /api/openapi.json {
        return 404;
    }

    # ---------- 前端路由回落 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/law-firm.access.log;
    error_log  /var/log/nginx/law-firm.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
