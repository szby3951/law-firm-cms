# ============================================================================
# 律所客户智能管理系统 —— Nginx 生产配置
#
# 放置位置：/etc/nginx/conf.d/law-firm.conf
# 使用前替换：law.example.com、证书路径、前端产物目录
#
# 关键点（都是踩过的坑，不要随意删）：
#   1. location / 必须 try_files ... /index.html：前端用 history 路由，
#      直接刷新 /admin/dashboard 这类地址需要回落到 index.html；
#   2. AI 的 location 必须 proxy_buffering off + gzip off + 长超时，
#      否则 SSE 流式回答会被缓冲成"转圈几十秒后一次性吐出"或直接断开；
#   3. 必须透传 X-Forwarded-For：审计日志的操作 IP 取的就是它，
#      少了这个头，所有操作在日志里都显示为 127.0.0.1；
#   4. client_max_body_size 要与后端 MAX_UPLOAD_SIZE 对齐，否则大附件在
#      nginx 层就被 413 拦掉，后端连日志都不会有。
# ============================================================================

upstream law_firm_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------- HTTP：全部跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name law.example.com;

    # 证书续期校验路径需要放行（用 certbot 时）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # 注意 nginx 版本差异：
    #   >= 1.25.1 用下面这行 `http2 on;`
    #   Ubuntu 22.04 自带的是 1.18，不认这个指令，会报 unknown directive，
    #   需改成 `listen 443 ssl http2;` + `listen [::]:443 ssl http2;` 并删掉本行
    http2 on;
    server_name law.example.com;

    ssl_certificate     /etc/nginx/ssl/law.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/law.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 前端构建产物目录（npm run build 的 dist 内容）
    root  /var/www/law-firm/dist;
    index index.html;

    # 与后端 MAX_UPLOAD_SIZE（20MB）保持一致的余量
    client_max_body_size 25m;
    client_body_timeout  120s;

    # 前端编译产物：内容哈希命名，可长期缓存
    location /assets/ {
        expires 30d;
        # 注意：location 里一旦出现 add_header，就不再继承 server 级的安全头，
        # 因此这里显式重复必要的几条。
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 入口 HTML 不缓存，保证发版后用户立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- AI 流式接口（SSE）----------
    # 必须放在 /api/ 之前：正则 location 优先级高于普通前缀匹配。
    location ~ ^/api/(ai|business)/ {
        proxy_pass http://law_firm_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- 普通 API ----------
    location /api/ {
        proxy_pass http://law_firm_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
    }

    # ---------- 健康检查：只给内网/本机 ----------
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://law_firm_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 接口文档：生产一律 404 ----------
    # 后端 APP_ENV=prod 时本来就不注册这几个路由，这里再兜一层，
    # 防止有人误把 APP_ENV 改回 dev 就在公网暴露全量接口。
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }
    location = /api/openapi.json {
        return 404;
    }

    # ---------- 前端路由回落 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/law-firm.access.log;
    error_log  /var/log/nginx/law-firm.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
